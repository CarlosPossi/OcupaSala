{% extends "base.html" %}
{% block title %}Criar conta{% endblock %}
{% block auth_content %}
<div class="auth-card">
    <div class="auth-head">
        <h1>Criar conta</h1>
        <p>Comece a gerenciar seus espaços agora.</p>
    </div>

    <form method="POST" action="{{ url_for('auth.cadastro') }}">
        <div class="form-group">
            <label for="nome">Nome completo</label>
            <input id="nome" type="text" name="nome" required minlength="2" placeholder="Como quer ser chamado?"
                autocomplete="name">
        </div>
        <div class="form-group">
            <label for="email">E-mail</label>
            <input id="email" type="email" name="email" required placeholder="seuemail@empresa.com"
                autocomplete="username">
        </div>
        <div class="form-group" style="margin-bottom: 28px;">
            <label for="senha">Senha</label>
            <input id="senha" type="password" name="senha" required minlength="6" placeholder="Mínimo 6 caracteres"
                autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Criar conta</button>
    </form>
    <p class="auth-foot">
        Já possui conta? <a href="{{ url_for('auth.login') }}">Fazer login</a>
    </p>
</div>
{% endblock %}
