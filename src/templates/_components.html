{% macro tags(sala) -%}
<span class="tag tag-tipo"><span class="tag-dot"></span>{{ sala.tipo }}</span>
<span class="tag tag-unidade tag-unidade-{{ sala.unidade_slug }}"><span class="tag-dot"></span>{{ sala.unidade }}</span>
{%- endmacro %}

{% macro header(titulo, sub) -%}
<div class="page-head">
    <div>
        <h1 class="page-title">{{ titulo }}</h1>
        <p class="page-sub">{{ sub }}</p>
    </div>
    <div class="page-actions">{{ caller() if caller else '' }}</div>
</div>
{%- endmacro %}

{% macro data_br(iso) -%}{{ iso[8:10] }}/{{ iso[5:7] }}/{{ iso[0:4] }}{%- endmacro %}
