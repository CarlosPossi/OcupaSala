{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block auth_content %}
<div class="auth-card">
    <div class="auth-head">
        <h1>Entrar</h1>
        <p>Acesse sua conta OcupaSala</p>
    </div>

    <form method="POST" action="{{ url_for('auth.login') }}">
        <div class="form-group">
            <label for="email">E-mail</label>
            <input id="email" type="email" name="email" required placeholder="seu@email.com" autocomplete="username">
        </div>
        <div class="form-group" style="margin-bottom: 28px;">
            <label for="senha">Senha</label>
            <input id="senha" type="password" name="senha" required placeholder="••••••••"
                autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Entrar no Dashboard</button>
    </form>


    <p class="auth-foot">
        Novo por aqui? <a href="{{ url_for('auth.cadastro') }}">Crie uma conta gratuita</a>
    </p>
</div>
{% endblock %}
