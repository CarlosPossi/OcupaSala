{% extends "base.html" %}
{% from "_components.html" import header %}
{% block title %}Configurações{% endblock %}
{% block content %}
{{ header("Configurações", "Gerencie seu perfil e a segurança da sua conta.") }}

<div class="narrow">
    <div class="panel" style="margin-bottom: 24px;">
        <div class="panel-title">Seu perfil</div>
        <form method="POST" action="{{ url_for('views.configuracoes') }}">
            <input type="hidden" name="acao" value="perfil">
            <div class="form-group"><label for="nome">Nome para exibição</label>
                <input id="nome" type="text" name="nome" value="{{ session.get('user_nome') }}" required minlength="2">
            </div>
            <div class="form-group"><label>E-mail</label>
                <input type="email" value="{{ session.get('user_email') }}" disabled>
            </div>
            <button class="btn btn-primary" type="submit">Salvar perfil</button>
        </form>
    </div>
    <div class="panel">
        <div class="panel-title">Alterar senha</div>
        <form method="POST" action="{{ url_for('views.configuracoes') }}">
            <input type="hidden" name="acao" value="senha">
            <div class="form-group"><label for="atual">Senha atual</label>
                <input id="atual" type="password" name="atual" required autocomplete="current-password">
            </div>
            <div class="form-group"><label for="nova">Nova senha</label>
                <input id="nova" type="password" name="nova" required minlength="6" placeholder="Mínimo 6 caracteres"
                    autocomplete="new-password">
            </div>
            <button class="btn btn-primary" type="submit">Alterar senha</button>
        </form>
    </div>
</div>
{% endblock %}
