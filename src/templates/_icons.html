{% macro ico(name, size=18) -%}
<svg class="ico" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    {%- if name == 'dashboard' %}
    <rect x="3" y="3" width="7" height="9" rx="1.5" />
    <rect x="14" y="3" width="7" height="5" rx="1.5" />
    <rect x="14" y="12" width="7" height="9" rx="1.5" />
    <rect x="3" y="16" width="7" height="5" rx="1.5" />
    {%- elif name == 'plus' %}
    <rect x="3" y="4" width="18" height="17" rx="2.5" />
    <path d="M8 2v4M16 2v4M3 10h18M12 13v5M9.5 15.5h5" />
    {%- elif name == 'search' %}
    <circle cx="11" cy="11" r="7" />
    <path d="m20 20-3.5-3.5" />
    {%- elif name == 'timeline' %}
    <path d="M3 6h9M7 12h12M5 18h8" />
    <circle cx="16" cy="6" r="1.5" />
    <circle cx="4" cy="12" r="1.5" />
    <circle cx="17" cy="18" r="1.5" />
    {%- elif name == 'list' %}
    <path d="M9 6h11M9 12h11M9 18h11" />
    <path d="m3.5 6 1 1 2-2M3.5 12l1 1 2-2M3.5 18l1 1 2-2" />
    {%- elif name == 'door' %}
    <path d="M5 21V4a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v17M3 21h18" />
    <circle cx="12.5" cy="12.5" r=".8" fill="currentColor" />
    {%- elif name == 'chart' %}
    <path d="M4 20V10M10 20V4M16 20v-7M22 20H2" />
    {%- elif name == 'settings' %}
    <circle cx="12" cy="12" r="3" />
    <path
        d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" />
    {%- elif name == 'logout' %}
    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" />
    {%- elif name == 'download' %}
    <path d="M12 3v12M7 10l5 5 5-5M4 21h16" />
    {%- elif name == 'clock' %}
    <circle cx="12" cy="12" r="9" />
    <path d="M12 7v5l3 2" />
    {%- elif name == 'users' %}
    <circle cx="9" cy="8" r="3.5" />
    <path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5" />
    {%- elif name == 'repeat' %}
    <path d="m17 2 4 4-4 4" />
    <path d="M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4" />
    <path d="M21 13v2a3 3 0 0 1-3 3H3" />
    {%- elif name == 'sparkle' %}
    <path
        d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z" />
    {%- elif name == 'menu' %}
    <path d="M4 6h16M4 12h16M4 18h16" />
    {%- elif name == 'arrow' %}
    <path d="M5 12h14M13 6l6 6-6 6" />
    {%- elif name == 'left' %}
    <path d="m15 18-6-6 6-6" />
    {%- elif name == 'right' %}
    <path d="m9 18 6-6-6-6" />
    {%- elif name == 'trash' %}
    <path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14" />
    {%- elif name == 'eye' %}
    <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" />
    <circle cx="12" cy="12" r="3" />
    {%- endif -%}
</svg>
{%- endmacro %}
